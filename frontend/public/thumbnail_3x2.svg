<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Inter:wght@400;500;600;700&amp;family=Roboto+Mono:wght@500;700&amp;display=swap');
      .title { font-family: 'Bricolage Grotesque', 'Inter', -apple-system, sans-serif; font-weight: 800; }
      .sans { font-family: 'Inter', -apple-system, sans-serif; }
      .mono { font-family: 'Roboto Mono', monospace; }
    </style>
    <filter id="card-shadow-32" x="-8%" y="-8%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="6" dy="10" stdDeviation="16" flood-color="#1a3300" flood-opacity="0.08"/>
    </filter>
    <filter id="pop-shadow-32" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="4" dy="6" stdDeviation="0" flood-color="#1a3300" flood-opacity="1"/>
    </filter>
  </defs>

  <!-- Background: Cream Paper -->
  <rect width="1200" height="800" fill="#fcfaf5"/>

  <!-- Sketchbook grid / subtle dots pattern -->
  <g opacity="0.16">
    <circle cx="75" cy="75" r="1.5" fill="#1a3300" />
    <circle cx="150" cy="75" r="1.5" fill="#1a3300" />
    <circle cx="225" cy="75" r="1.5" fill="#1a3300" />
    <circle cx="300" cy="75" r="1.5" fill="#1a3300" />
    <circle cx="375" cy="75" r="1.5" fill="#1a3300" />
    <circle cx="450" cy="75" r="1.5" fill="#1a3300" />
    <circle cx="525" cy="75" r="1.5" fill="#1a3300" />
    <circle cx="600" cy="75" r="1.5" fill="#1a3300" />
    <circle cx="675" cy="75" r="1.5" fill="#1a3300" />
    <circle cx="750" cy="75" r="1.5" fill="#1a3300" />
    <circle cx="825" cy="75" r="1.5" fill="#1a3300" />
    <circle cx="900" cy="75" r="1.5" fill="#1a3300" />
    <circle cx="975" cy="75" r="1.5" fill="#1a3300" />
    <circle cx="1050" cy="75" r="1.5" fill="#1a3300" />
    <circle cx="1125" cy="75" r="1.5" fill="#1a3300" />

    <circle cx="75" cy="725" r="1.5" fill="#1a3300" />
    <circle cx="150" cy="725" r="1.5" fill="#1a3300" />
    <circle cx="225" cy="725" r="1.5" fill="#1a3300" />
    <circle cx="300" cy="725" r="1.5" fill="#1a3300" />
    <circle cx="375" cy="725" r="1.5" fill="#1a3300" />
    <circle cx="450" cy="725" r="1.5" fill="#1a3300" />
    <circle cx="525" cy="725" r="1.5" fill="#1a3300" />
    <circle cx="600" cy="725" r="1.5" fill="#1a3300" />
    <circle cx="675" cy="725" r="1.5" fill="#1a3300" />
    <circle cx="750" cy="725" r="1.5" fill="#1a3300" />
    <circle cx="825" cy="725" r="1.5" fill="#1a3300" />
    <circle cx="900" cy="725" r="1.5" fill="#1a3300" />
    <circle cx="975" cy="725" r="1.5" fill="#1a3300" />
    <circle cx="1050" cy="725" r="1.5" fill="#1a3300" />
    <circle cx="1125" cy="725" r="1.5" fill="#1a3300" />
  </g>

  <!-- Top Pill: Hackathon Track Badge -->
  <g transform="translate(75, 55)">
    <rect x="0" y="0" width="370" height="38" rx="19" fill="#ffffff" stroke="#1a3300" stroke-width="1.5"/>
    <circle cx="22" cy="19" r="4" fill="#4285F4"/>
    <circle cx="32" cy="19" r="4" fill="#EA4335"/>
    <circle cx="42" cy="19" r="4" fill="#FBBC04"/>
    <circle cx="52" cy="19" r="4" fill="#34A853"/>
    <text x="66" y="24" class="sans" font-size="13" font-weight="700" fill="#1a3300" letter-spacing="0.02em">ALL THINGS AGENTIC · THE TASKMASTER</text>
  </g>

  <!-- Left Hero Content Block -->
  <g transform="translate(75, 125)">
    <!-- Favicon Icon Badge -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="80" height="80" rx="18" fill="#ffe95c" stroke="#1a3300" stroke-width="3" filter="url(#pop-shadow-32)"/>
      <text x="40" y="55" class="title" font-size="40" fill="#1a3300" text-anchor="middle" letter-spacing="-0.03em">RO</text>
    </g>

    <!-- Project Name -->
    <text x="100" y="60" class="title" font-size="52" fill="#1a3300" letter-spacing="-0.03em">RoomieOps AI</text>

    <!-- Main Headline with Marker Accent -->
    <g transform="translate(0, 115)">
      <path d="M 0 54 Q 180 50 490 56 Q 245 60 0 54 Z" fill="#ffe95c" opacity="0.9"/>
      <text x="0" y="48" class="title" font-size="46" fill="#1a3300" letter-spacing="-0.02em">Autonomous Roommate</text>
      <text x="0" y="102" class="title" font-size="46" fill="#1a3300" letter-spacing="-0.02em">Rent &amp; Expense Agent</text>
    </g>

    <!-- Tagline -->
    <text x="0" y="300" class="sans" font-size="19" font-weight="500" fill="#335c14" line-height="1.6">
      <tspan x="0" dy="0">Multimodal receipt parsing, min-cash-flow debt</tspan>
      <tspan x="0" dy="28">simplification, and zero-friction instant UPI settlement.</tspan>
    </text>

    <!-- Key Feature Pills Grid -->
    <g transform="translate(0, 390)">
      <g transform="translate(0, 0)">
        <rect width="240" height="44" rx="10" fill="#ffffff" stroke="#1a3300" stroke-width="1.5"/>
        <circle cx="20" cy="22" r="5" fill="#ffe95c" stroke="#1a3300" stroke-width="1.5"/>
        <text x="36" y="27" class="sans" font-size="13" font-weight="700" fill="#1a3300">Gemini Multimodal Vision</text>
      </g>
      <g transform="translate(252, 0)">
        <rect width="230" height="44" rx="10" fill="#ffffff" stroke="#1a3300" stroke-width="1.5"/>
        <circle cx="20" cy="22" r="5" fill="#a7f3d0" stroke="#1a3300" stroke-width="1.5"/>
        <text x="36" y="27" class="sans" font-size="13" font-weight="700" fill="#1a3300">Min-Cash-Flow Debt Graph</text>
      </g>
      <g transform="translate(0, 56)">
        <rect width="240" height="44" rx="10" fill="#ffffff" stroke="#1a3300" stroke-width="1.5"/>
        <circle cx="20" cy="22" r="5" fill="#fed7aa" stroke="#1a3300" stroke-width="1.5"/>
        <text x="36" y="27" class="sans" font-size="13" font-weight="700" fill="#1a3300">Autonomous Escalation</text>
      </g>
      <g transform="translate(252, 56)">
        <rect width="230" height="44" rx="10" fill="#ffffff" stroke="#1a3300" stroke-width="1.5"/>
        <circle cx="20" cy="22" r="5" fill="#bae6fd" stroke="#1a3300" stroke-width="1.5"/>
        <text x="36" y="27" class="sans" font-size="13" font-weight="700" fill="#1a3300">Zero-Friction UPI Pay Links</text>
      </g>
    </g>

    <!-- Cloud Tech Stack -->
    <g transform="translate(0, 535)">
      <text x="0" y="16" class="mono" font-size="12" font-weight="600" fill="#4d7c2a" letter-spacing="0.05em">POWERED BY GOOGLE CLOUD RUN · FIRESTORE · PUB/SUB · GEMINI 1.5</text>
    </g>
  </g>

  <!-- Right Visual Presentation Section -->
  <g transform="translate(630, 75)">
    <!-- Debt Network Visualizer Card -->
    <g transform="translate(40, 30) rotate(-2)" filter="url(#card-shadow-32)">
      <rect width="460" height="280" rx="18" fill="#ffffff" stroke="#1a3300" stroke-width="2"/>
      
      <!-- Card header -->
      <rect x="0" y="0" width="460" height="42" rx="18" fill="#f4efe2"/>
      <rect x="0" y="24" width="460" height="18" fill="#f4efe2"/>
      <line x1="0" y1="42" x2="460" y2="42" stroke="#1a3300" stroke-width="1.5"/>
      <circle cx="20" cy="21" r="5" fill="#f87171" stroke="#1a3300" stroke-width="1"/>
      <circle cx="36" cy="21" r="5" fill="#fbbf24" stroke="#1a3300" stroke-width="1"/>
      <circle cx="52" cy="21" r="5" fill="#34d399" stroke="#1a3300" stroke-width="1"/>
      <text x="230" y="26" class="sans" font-size="12" font-weight="700" fill="#1a3300" text-anchor="middle">MIN-CASH-FLOW DEBT SOLVER (4 TRANS → 2)</text>

      <!-- Network Nodes -->
      <g transform="translate(65, 95)">
        <circle cx="32" cy="32" r="26" fill="#fed7aa" stroke="#1a3300" stroke-width="2"/>
        <text x="32" y="38" class="sans" font-size="13" font-weight="800" fill="#1a3300" text-anchor="middle">Alex</text>
      </g>

      <g transform="translate(330, 95)">
        <circle cx="32" cy="32" r="26" fill="#a7f3d0" stroke="#1a3300" stroke-width="2"/>
        <text x="32" y="38" class="sans" font-size="13" font-weight="800" fill="#1a3300" text-anchor="middle">Sarah</text>
      </g>

      <g transform="translate(200, 195)">
        <circle cx="32" cy="32" r="26" fill="#ffe95c" stroke="#1a3300" stroke-width="2"/>
        <text x="32" y="38" class="sans" font-size="13" font-weight="800" fill="#1a3300" text-anchor="middle">Mike</text>
      </g>

      <!-- Directed Edge Alex -> Sarah -->
      <path d="M 130 127 L 320 127" stroke="#1a3300" stroke-width="2.5" stroke-dasharray="6,4"/>
      <polygon points="322,127 312,122 312,132" fill="#1a3300"/>
      <rect x="195" y="110" width="75" height="24" rx="6" fill="#ffe95c" stroke="#1a3300" stroke-width="1.5"/>
      <text x="232" y="126" class="mono" font-size="11" font-weight="700" fill="#1a3300" text-anchor="middle">₹ 1,420</text>

      <!-- Directed Edge Mike -> Sarah -->
      <path d="M 250 195 L 335 155" stroke="#1a3300" stroke-width="2.5"/>
      <polygon points="337,154 326,156 332,165" fill="#1a3300"/>
      <rect x="275" y="175" width="65" height="22" rx="6" fill="#ffffff" stroke="#1a3300" stroke-width="1.5"/>
      <text x="307" y="190" class="mono" font-size="11" font-weight="700" fill="#1a3300" text-anchor="middle">₹ 850</text>
    </g>

    <!-- Gemini Receipt Ingestion Card -->
    <g transform="translate(10, 340) rotate(2)" filter="url(#card-shadow-32)">
      <rect width="490" height="270" rx="18" fill="#ffffff" stroke="#1a3300" stroke-width="2"/>
      
      <rect x="0" y="0" width="490" height="44" rx="18" fill="#ffe95c"/>
      <rect x="0" y="24" width="490" height="20" fill="#ffe95c"/>
      <line x1="0" y1="44" x2="490" y2="44" stroke="#1a3300" stroke-width="1.5"/>
      <text x="24" y="28" class="title" font-size="15" fill="#1a3300">GEMINI PARSER · "WiFi &amp; Fiber Broadband"</text>
      <rect x="375" y="10" width="95" height="24" rx="12" fill="#1a3300"/>
      <text x="422" y="26" class="mono" font-size="11" font-weight="700" fill="#ffe95c" text-anchor="middle">98.4% CONF</text>

      <g transform="translate(24, 65)">
        <text x="0" y="20" class="sans" font-size="15" font-weight="700" fill="#1a3300">High-Speed Broadband Bill</text>
        <text x="340" y="20" class="mono" font-size="16" font-weight="700" fill="#1a3300">₹ 2,499.00</text>
        
        <text x="0" y="46" class="sans" font-size="13" fill="#555555">Split Rule: 3-Way Equal (₹833 / roomie)</text>
        <line x1="0" y1="66" x2="442" y2="66" stroke="#e5e0d3" stroke-width="1.5" stroke-dasharray="4,4"/>

        <!-- Autonomous Agent Action Feed Item -->
        <g transform="translate(0, 84)">
          <rect width="442" height="50" rx="8" fill="#fcfaf5" stroke="#1a3300" stroke-width="1.2"/>
          <circle cx="20" cy="25" r="6" fill="#34d399"/>
          <text x="36" y="23" class="sans" font-size="13" font-weight="700" fill="#1a3300">Autonomous Payment Nudge Dispatched</text>
          <text x="36" y="40" class="mono" font-size="11" fill="#666666">Cloud Scheduler · Tone Level: FIRM (Due in 24h)</text>
          <rect x="355" y="13" width="75" height="24" rx="6" fill="#1a3300"/>
          <text x="392" y="29" class="sans" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">UPI Link</text>
        </g>
      </g>
    </g>

    <!-- Floating Taskmaster Badge -->
    <g transform="translate(370, 580) rotate(-3)" filter="url(#pop-shadow-32)">
      <rect width="165" height="54" rx="12" fill="#1a3300" stroke="#ffe95c" stroke-width="2"/>
      <text x="82" y="25" class="sans" font-size="11" font-weight="800" fill="#ffe95c" text-anchor="middle" letter-spacing="0.06em">TASKMASTER</text>
      <text x="82" y="43" class="sans" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">100% Agentic</text>
    </g>
  </g>
</svg>
