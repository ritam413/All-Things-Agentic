<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Inter:wght@400;500;600;700&amp;family=Roboto+Mono:wght@500;700&amp;display=swap');
      .title { font-family: 'Bricolage Grotesque', 'Inter', -apple-system, sans-serif; font-weight: 800; }
      .sans { font-family: 'Inter', -apple-system, sans-serif; }
      .mono { font-family: 'Roboto Mono', monospace; }
    </style>
    <filter id="card-shadow" x="-8%" y="-8%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="6" dy="10" stdDeviation="16" flood-color="#1a3300" flood-opacity="0.08"/>
    </filter>
    <filter id="pop-shadow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="4" dy="6" stdDeviation="0" flood-color="#1a3300" flood-opacity="1"/>
    </filter>
  </defs>

  <!-- Background: Cream Paper -->
  <rect width="1280" height="720" fill="#fcfaf5"/>

  <!-- Subtle sketchbook grid / dots pattern -->
  <g opacity="0.18">
    <circle cx="80" cy="80" r="1.5" fill="#1a3300" />
    <circle cx="160" cy="80" r="1.5" fill="#1a3300" />
    <circle cx="240" cy="80" r="1.5" fill="#1a3300" />
    <circle cx="320" cy="80" r="1.5" fill="#1a3300" />
    <circle cx="400" cy="80" r="1.5" fill="#1a3300" />
    <circle cx="480" cy="80" r="1.5" fill="#1a3300" />
    <circle cx="560" cy="80" r="1.5" fill="#1a3300" />
    <circle cx="640" cy="80" r="1.5" fill="#1a3300" />
    <circle cx="720" cy="80" r="1.5" fill="#1a3300" />
    <circle cx="800" cy="80" r="1.5" fill="#1a3300" />
    <circle cx="880" cy="80" r="1.5" fill="#1a3300" />
    <circle cx="960" cy="80" r="1.5" fill="#1a3300" />
    <circle cx="1040" cy="80" r="1.5" fill="#1a3300" />
    <circle cx="1120" cy="80" r="1.5" fill="#1a3300" />
    <circle cx="1200" cy="80" r="1.5" fill="#1a3300" />
    
    <circle cx="80" cy="180" r="1.5" fill="#1a3300" />
    <circle cx="160" cy="180" r="1.5" fill="#1a3300" />
    <circle cx="240" cy="180" r="1.5" fill="#1a3300" />
    <circle cx="320" cy="180" r="1.5" fill="#1a3300" />
    <circle cx="400" cy="180" r="1.5" fill="#1a3300" />
    <circle cx="480" cy="180" r="1.5" fill="#1a3300" />
    <circle cx="560" cy="180" r="1.5" fill="#1a3300" />
    <circle cx="640" cy="180" r="1.5" fill="#1a3300" />
    <circle cx="720" cy="180" r="1.5" fill="#1a3300" />
    <circle cx="800" cy="180" r="1.5" fill="#1a3300" />
    <circle cx="880" cy="180" r="1.5" fill="#1a3300" />
    <circle cx="960" cy="180" r="1.5" fill="#1a3300" />
    <circle cx="1040" cy="180" r="1.5" fill="#1a3300" />
    <circle cx="1120" cy="180" r="1.5" fill="#1a3300" />
    <circle cx="1200" cy="180" r="1.5" fill="#1a3300" />

    <circle cx="80" cy="640" r="1.5" fill="#1a3300" />
    <circle cx="160" cy="640" r="1.5" fill="#1a3300" />
    <circle cx="240" cy="640" r="1.5" fill="#1a3300" />
    <circle cx="320" cy="640" r="1.5" fill="#1a3300" />
    <circle cx="400" cy="640" r="1.5" fill="#1a3300" />
    <circle cx="480" cy="640" r="1.5" fill="#1a3300" />
    <circle cx="560" cy="640" r="1.5" fill="#1a3300" />
    <circle cx="640" cy="640" r="1.5" fill="#1a3300" />
    <circle cx="720" cy="640" r="1.5" fill="#1a3300" />
    <circle cx="800" cy="640" r="1.5" fill="#1a3300" />
    <circle cx="880" cy="640" r="1.5" fill="#1a3300" />
    <circle cx="960" cy="640" r="1.5" fill="#1a3300" />
    <circle cx="1040" cy="640" r="1.5" fill="#1a3300" />
    <circle cx="1120" cy="640" r="1.5" fill="#1a3300" />
    <circle cx="1200" cy="640" r="1.5" fill="#1a3300" />
  </g>

  <!-- Left Header Tag: Google All Things Agentic Hackathon -->
  <g transform="translate(80, 68)">
    <rect x="0" y="0" width="370" height="36" rx="18" fill="#ffffff" stroke="#1a3300" stroke-width="1.5"/>
    <!-- Google colorful spark dots -->
    <circle cx="20" cy="18" r="4" fill="#4285F4"/>
    <circle cx="30" cy="18" r="4" fill="#EA4335"/>
    <circle cx="40" cy="18" r="4" fill="#FBBC04"/>
    <circle cx="50" cy="18" r="4" fill="#34A853"/>
    <text x="64" y="23" class="sans" font-size="13" font-weight="700" fill="#1a3300" letter-spacing="0.02em">ALL THINGS AGENTIC · THE TASKMASTER</text>
  </g>

  <!-- Main Left Content Block -->
  <g transform="translate(80, 140)">
    <!-- Favicon Logo Badge (Exact replica of favicon.svg scaled and styled) -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="68" height="68" rx="16" fill="#ffe95c" stroke="#1a3300" stroke-width="3" filter="url(#pop-shadow)"/>
      <text x="34" y="47" class="title" font-size="34" fill="#1a3300" text-anchor="middle" letter-spacing="-0.03em">ro</text>
    </g>

    <!-- Product Title -->
    <text x="86" y="52" class="title" font-size="48" fill="#1a3300" letter-spacing="-0.03em">RoomieOps AI</text>
    
    <!-- Hero Headline with Highlighter Accent -->
    <g transform="translate(0, 106)">
      <!-- Highlighter Underline -->
      <path d="M 0 54 Q 180 50 480 56 Q 240 60 0 54 Z" fill="#ffe95c" opacity="0.9"/>
      <text x="0" y="48" class="title" font-size="44" fill="#1a3300" letter-spacing="-0.02em">Autonomous Roommate</text>
      <text x="0" y="98" class="title" font-size="44" fill="#1a3300" letter-spacing="-0.02em">Rent &amp; Expense Agent</text>
    </g>

    <!-- Description -->
    <text x="0" y="280" class="sans" font-size="18" font-weight="500" fill="#335c14" line-height="1.6">
      <tspan x="0" dy="0">Converts messy bills &amp; passive spreadsheets into an unattended</tspan>
      <tspan x="0" dy="28">background operator with debt simplification &amp; smart UPI settlement.</tspan>
    </text>

    <!-- Key Feature Badges Grid -->
    <g transform="translate(0, 360)">
      <!-- Badge 1 -->
      <g transform="translate(0, 0)">
        <rect width="240" height="42" rx="10" fill="#ffffff" stroke="#1a3300" stroke-width="1.5"/>
        <circle cx="20" cy="21" r="5" fill="#ffe95c" stroke="#1a3300" stroke-width="1.5"/>
        <text x="36" y="26" class="sans" font-size="13" font-weight="700" fill="#1a3300">Gemini Multimodal Ingestion</text>
      </g>
      <!-- Badge 2 -->
      <g transform="translate(252, 0)">
        <rect width="230" height="42" rx="10" fill="#ffffff" stroke="#1a3300" stroke-width="1.5"/>
        <circle cx="20" cy="21" r="5" fill="#a7f3d0" stroke="#1a3300" stroke-width="1.5"/>
        <text x="36" y="26" class="sans" font-size="13" font-weight="700" fill="#1a3300">Min-Cash-Flow Debt Graph</text>
      </g>
      <!-- Badge 3 -->
      <g transform="translate(0, 52)">
        <rect width="240" height="42" rx="10" fill="#ffffff" stroke="#1a3300" stroke-width="1.5"/>
        <circle cx="20" cy="21" r="5" fill="#fed7aa" stroke="#1a3300" stroke-width="1.5"/>
        <text x="36" y="26" class="sans" font-size="13" font-weight="700" fill="#1a3300">Autonomous Tone Escalation</text>
      </g>
      <!-- Badge 4 -->
      <g transform="translate(252, 52)">
        <rect width="230" height="42" rx="10" fill="#ffffff" stroke="#1a3300" stroke-width="1.5"/>
        <circle cx="20" cy="21" r="5" fill="#bae6fd" stroke="#1a3300" stroke-width="1.5"/>
        <text x="36" y="26" class="sans" font-size="13" font-weight="700" fill="#1a3300">Zero-Friction UPI Pay Links</text>
      </g>
    </g>

    <!-- Cloud Tech Stack Pill -->
    <g transform="translate(0, 480)">
      <text x="0" y="16" class="mono" font-size="12" font-weight="600" fill="#4d7c2a" letter-spacing="0.05em">POWERED BY GOOGLE CLOUD RUN · FIRESTORE · PUB/SUB · CLOUD SCHEDULER · GEMINI 1.5</text>
    </g>
  </g>

  <!-- Right Visual Area: Interactive Cards & Graphic Composition -->
  <g transform="translate(680, 80)">
    <!-- Decorative Card 1: Debt Graph Node View -->
    <g transform="translate(60, 40) rotate(-3)" filter="url(#card-shadow)">
      <rect width="440" height="260" rx="18" fill="#ffffff" stroke="#1a3300" stroke-width="2"/>
      
      <!-- Window header -->
      <rect x="0" y="0" width="440" height="40" rx="18" fill="#f4efe2"/>
      <rect x="0" y="24" width="440" height="16" fill="#f4efe2"/>
      <line x1="0" y1="40" x2="440" y2="40" stroke="#1a3300" stroke-width="1.5"/>
      <circle cx="20" cy="20" r="5" fill="#f87171" stroke="#1a3300" stroke-width="1"/>
      <circle cx="36" cy="20" r="5" fill="#fbbf24" stroke="#1a3300" stroke-width="1"/>
      <circle cx="52" cy="20" r="5" fill="#34d399" stroke="#1a3300" stroke-width="1"/>
      <text x="220" y="25" class="sans" font-size="12" font-weight="700" fill="#1a3300" text-anchor="middle">MIN-CASH-FLOW DEBT SOLVER (4 TRANS → 2)</text>

      <!-- Graph Content -->
      <!-- Node Alex -->
      <g transform="translate(70, 90)">
        <circle cx="30" cy="30" r="24" fill="#fed7aa" stroke="#1a3300" stroke-width="2"/>
        <text x="30" y="35" class="sans" font-size="12" font-weight="800" fill="#1a3300" text-anchor="middle">Alex</text>
      </g>

      <!-- Node Sarah -->
      <g transform="translate(310, 90)">
        <circle cx="30" cy="30" r="24" fill="#a7f3d0" stroke="#1a3300" stroke-width="2"/>
        <text x="30" y="35" class="sans" font-size="12" font-weight="800" fill="#1a3300" text-anchor="middle">Sarah</text>
      </g>

      <!-- Node Mike -->
      <g transform="translate(190, 180)">
        <circle cx="30" cy="30" r="24" fill="#ffe95c" stroke="#1a3300" stroke-width="2"/>
        <text x="30" y="35" class="sans" font-size="12" font-weight="800" fill="#1a3300" text-anchor="middle">Mike</text>
      </g>

      <!-- Arrow Alex -> Sarah -->
      <path d="M 130 115 L 300 115" stroke="#1a3300" stroke-width="2.5" stroke-dasharray="6,4"/>
      <polygon points="302,115 292,110 292,120" fill="#1a3300"/>
      <!-- Label -->
      <rect x="180" y="98" width="70" height="22" rx="6" fill="#ffe95c" stroke="#1a3300" stroke-width="1.5"/>
      <text x="215" y="113" class="mono" font-size="11" font-weight="700" fill="#1a3300" text-anchor="middle">₹ 1,420</text>

      <!-- Arrow Mike -> Sarah -->
      <path d="M 235 180 L 315 140" stroke="#1a3300" stroke-width="2.5"/>
      <polygon points="317,139 306,141 312,150" fill="#1a3300"/>
      <rect x="260" y="162" width="60" height="20" rx="6" fill="#ffffff" stroke="#1a3300" stroke-width="1.5"/>
      <text x="290" y="176" class="mono" font-size="11" font-weight="700" fill="#1a3300" text-anchor="middle">₹ 850</text>
    </g>

    <!-- Decorative Card 2: Multimodal Gemini Receipt Ingestion & Escalation Status -->
    <g transform="translate(10, 270) rotate(2)" filter="url(#card-shadow)">
      <rect width="470" height="250" rx="18" fill="#ffffff" stroke="#1a3300" stroke-width="2"/>
      
      <!-- Top banner -->
      <rect x="0" y="0" width="470" height="42" rx="18" fill="#ffe95c"/>
      <rect x="0" y="24" width="470" height="18" fill="#ffe95c"/>
      <line x1="0" y1="42" x2="470" y2="42" stroke="#1a3300" stroke-width="1.5"/>
      <text x="24" y="27" class="title" font-size="14" fill="#1a3300">GEMINI PARSER · "WiFi &amp; Fiber Optic Invoice"</text>
      <rect x="360" y="10" width="92" height="22" rx="11" fill="#1a3300"/>
      <text x="406" y="25" class="mono" font-size="10" font-weight="700" fill="#ffe95c" text-anchor="middle">98.4% CONF</text>

      <!-- Bill Breakdown Item List -->
      <g transform="translate(24, 60)">
        <text x="0" y="20" class="sans" font-size="14" font-weight="700" fill="#1a3300">High-Speed Broadband Bill</text>
        <text x="320" y="20" class="mono" font-size="15" font-weight="700" fill="#1a3300">₹ 2,499.00</text>
        
        <text x="0" y="44" class="sans" font-size="12" fill="#555555">Split Rule: 3-Way Equal (₹833 / roomie)</text>

        <!-- Divider -->
        <line x1="0" y1="62" x2="422" y2="62" stroke="#e5e0d3" stroke-width="1.5" stroke-dasharray="4,4"/>

        <!-- Autonomous Agent Action Feed Item -->
        <g transform="translate(0, 78)">
          <rect width="422" height="46" rx="8" fill="#fcfaf5" stroke="#1a3300" stroke-width="1.2"/>
          <circle cx="20" cy="23" r="6" fill="#34d399"/>
          <text x="36" y="21" class="sans" font-size="12" font-weight="700" fill="#1a3300">Autonomous Payment Nudge Dispatched</text>
          <text x="36" y="37" class="mono" font-size="10" fill="#666666">Cloud Scheduler · Tone Level: FIRM (Due in 24h)</text>
          <rect x="340" y="12" width="70" height="22" rx="6" fill="#1a3300"/>
          <text x="375" y="27" class="sans" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">UPI Link</text>
        </g>
      </g>
    </g>

    <!-- Floating Badge: Taskmaster Agent Verified -->
    <g transform="translate(360, 480) rotate(-4)" filter="url(#pop-shadow)">
      <rect width="160" height="52" rx="12" fill="#1a3300" stroke="#ffe95c" stroke-width="2"/>
      <text x="80" y="24" class="sans" font-size="11" font-weight="800" fill="#ffe95c" text-anchor="middle" letter-spacing="0.06em">TASKMASTER</text>
      <text x="80" y="42" class="sans" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">100% Agentic</text>
    </g>
  </g>
</svg>
